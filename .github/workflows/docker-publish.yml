name: Build and Publish MitarashiDango Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'MitarashiDango branch or tag to build'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mitarashidango

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Dando_Docker repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Determine source branch/tag and commit SHA
        id: source-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            BRANCH="${GITHUB_REF#refs/tags/}"
          else
            BRANCH="main"
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

          # Fetch latest commit SHA from remote repository to invalidate Docker build cache on updates
          COMMIT_SHA=$(git ls-remote https://github.com/ultrawazer/MitarashiDango.git "refs/heads/${BRANCH}" "refs/tags/${BRANCH}" "${BRANCH}" | head -n 1 | awk '{print $1}')
          if [ -z "${COMMIT_SHA}" ]; then
            COMMIT_SHA="${BRANCH}"
          fi
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_URL=https://github.com/ultrawazer/MitarashiDango.git
            BRANCH=${{ steps.source-ref.outputs.branch }}
            APP_COMMIT=${{ steps.source-ref.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
